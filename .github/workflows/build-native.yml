name: Build native installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: desktop/dist/*.exe

  macos:
    runs-on: macos-13
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      # zip only (no pkg/signing) — more reliable on CI
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: desktop/dist/*.zip

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Build debug APK (no signing required)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-13
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: |
          npx cap add ios || true
          npx cap sync ios
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload/OpenCircle.app
          echo "OpenCircle iOS shell — open in Xcode and Archive with your Team ID to produce a signed .ipa" > Payload/README.txt
          if [ -d ios/App ]; then cp -R ios/App Payload/OpenCircle.app/ 2>/dev/null || true; fi
          zip -r OpenCircle-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile/OpenCircle-unsigned.ipa
