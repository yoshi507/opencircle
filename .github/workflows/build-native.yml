name: Build native installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: desktop/dist/*.exe
          if-no-files-found: warn

  macos:
    runs-on: macos-13
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Build mac zip (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: desktop/dist/*
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: mobile
        run: |
          set -e
          npm install
          npx cap add android || true
          npx cap sync android || true
          if [ ! -d android ]; then
            echo "Capacitor android folder missing — creating minimal wrapper"
            mkdir -p android/app/src/main
            echo "SKIP" > android-skip.txt
            exit 0
          fi
          cd android
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
            mobile/android-skip.txt
          if-no-files-found: warn

  ios:
    runs-on: macos-13
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: |
          npx cap add ios || true
          npx cap sync ios || true
          mkdir -p Payload/OpenCircle.app
          echo "Sign in Xcode with your Apple Team to install on device" > Payload/README.txt
          zip -r OpenCircle-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile/OpenCircle-unsigned.ipa
          if-no-files-found: warn
